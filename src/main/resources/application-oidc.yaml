quarkus:
  oidc:
    tenant-enabled: true
    application-type: hybrid
    authentication:
      scopes:
        - email
        - profile
      redirect-path: /auth/callback
      restore-path-after-redirect: true
      java-script-auto-redirect: false
  http:
    proxy:
      proxy-address-forwarding: true
      enable-forwarded-host: true
    auth:
      permission:
        public:
          policy: permit
          paths:
            - /q/metrics
            - /q/health
            - /q/health/*
            - /logout
            - /logout/*
            - /signed-out
            - /api/app
            - /assets/*
            - /icons/*
            - /favicon.png
        authenticated:
          policy: wombat-access # authenticated + optional auth.* rules
          paths:
            - /*

auth:
  enabled: true
  ## Identity provider roles granting each Wombat role, "*" grants it to every authenticated user.
  ## Users with no mapped role are denied.
  #roles:
  #  admin: [wombat-admins]
  #  user: [wombat-users]

## Access rules (all optional)
