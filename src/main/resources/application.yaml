quarkus:
  banner:
    path: wombat-banner.txt
  http:
    limits:
      max-initial-line-length: 32768
    auth:
      permission:
        ui-pages:
          policy: wombat-ui-page
          paths:
            - /
            - /impact
            - /impact/*
            - /users
            - /users/*
            - /api-keys
            - /api-keys/*
  quinoa:
    ui-dir: src/main/webui
    build-dir: dist
    enable-spa-routing: true
    run-tests: true
    ignored-path-prefixes:
      - /api/
      - /q/
      - /logout
      - /auth/
    package-manager-install:
      ~: true
      node-version: 22.22.2
    dev-server:
      port: 5173
  rest-client:
    logging:
      scope: none
      body-limit: 1024
  log:
    category:
      "persistence":
        min-level: TRACE
        level: TRACE
      "io.quarkus.kubernetes.client.deployment.DevServicesKubernetesProcessor":
        level: "OFF"
      "io.quarkus.datasource.deployment.devservices.DevServicesDatasourceProcessor":
        level: "OFF"
  smallrye-openapi:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger
    always-include: true

  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:./data/db/local.db"
      min-size: 0
  ## PostgreSQL Datasource Configuration
  #datasource:
  #  db-kind: postgresql
  #  username: my-username
  #  password: my-password
  #  jdbc:
  #    url: "jdbc:postgresql://localhost:5432/wombat"

  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: false
    locations: classpath:db/migration/${quarkus.datasource.db-kind}
  scheduler:
    enabled: true
  kubernetes-client:
    devservices:
      enabled: false
  vault:
    devservices:
      enabled: false
#    url: "${VAULT_ADDR}"
#    kv-secret-engine-mount-path: secret
#    tls:
#      ca-cert: "/etc/vault/ca.pem"
#      skip-verify: false
#    authentication:
#      app-role:
#        role-id: "${VAULT_ROLE_ID}"
#        secret-id: "${VAULT_SECRET_ID}"
  oidc:
    tenant-enabled: false # enabled by the "oidc" profile, see application-oidc.yaml
  keycloak:
    devservices:
      enabled: false
  micrometer:
    binder:
      netty:
        enabled: false
      http-client:
        enabled: false

"%test":
  quarkus:
    quinoa:
      enabled: false

module:
  kubernetes-api:
    enabled: true
  llm-prometheus:
    enabled: true
  llm-anthropic:
    enabled: true
  extension:
    path: "extensions"

evaluation:
  cache:
    enabled: true
    maximum-size: 5000
    expire-after-write: 10m

compaction:
  cron: "0 1 * * * ?" # a minute past every hour
  window: 1h
  delay: 1m

monitor:
  heartbeat: "10s"
  environments-file: "monitored/monitored-environments.yaml"

ui:
  max-date-range:
    duration: 1
    unit: YEARS

connector:
  boavizta:
    uri: "https://api.boavizta.org/v1/"
  ecologits:
    uri: "https://api.ecologits.ai/"

backup:
  enabled: false
  cron: "0 0 2 * * ?"
  restore-on-startup: true
  cleanup:
    enabled: true
    cron: "0 0 3 * * ?"
    retain-last: 10
