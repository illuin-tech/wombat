environments:
  restored-test:
    id: restored-test
    assets:
      - type: tech.illuin.wombat-module.llm-prometheus
        id: restored-llm
        environment-id: restored-test
        name: Restored secret test
        prometheus-url: http://127.0.0.1:9/
        heartbeat-skip: 1000
        username: test
        password-key: WOMBAT_RESTORED_TEST_SECRET
        profile:
          provider: mistralai
          model: mistral-large-latest
          location: FRA
          dynamic-profile:
            query: 'sum(increase(generation_tokens_total[10s]))'
