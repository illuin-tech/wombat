quarkus:
  banner:
    path: wombat-banner.txt
  http:
    limits:
      max-initial-line-length: 32768
    auth:
      permission:
        ui-pages:
          policy: wombat-ui-page
          paths:
            - /
            - /impact
            - /impact/*
            - /users
            - /users/*
            - /api-keys
            - /api-keys/*
  quinoa:
    ui-dir: src/main/webui
    build-dir: dist
    enable-spa-routing: true
    run-tests: true
    ignored-path-prefixes:
      - /api/
      - /q/
      - /logout
      - /auth/
    package-manager-install:
      ~: true
      node-version: 22.22.2
    dev-server:
      port: 5173
  rest-client:
    logging:
      scope: none
      body-limit: 1024
  log:
    category:
      "persistence":
        min-level: TRACE
        level: TRACE
      "io.quarkus.kubernetes.client.deployment.DevServicesKubernetesProcessor":
        level: "OFF"
      "io.quarkus.datasource.deployment.devservices.DevServicesDatasourceProcessor":
        level: "OFF"
  smallrye-openapi:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger
    always-include: true

  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:./data/db/local.db"
      min-size: 0
  ## PostgreSQL Datasource Configuration
  #datasource:
  #  db-kind: postgresql
  #  username: my-username
  #  password: my-password
  #  jdbc:
  #    url: "jdbc:postgresql://localhost:5432/wombat"

  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: false
    locations: classpath:db/migration/${quarkus.datasource.db-kind}
  scheduler:
    enabled: true
  kubernetes-client:
    devservices:
      enabled: false
  vault:
    devservices:
      enabled: false
#    url: "${VAULT_ADDR}"
#    kv-secret-engine-mount-path: secret
#    tls:
#      ca-cert: "/etc/vault/ca.pem"
#      skip-verify: false
  oidc:
    tenant-enabled: false # enabled by the "oidc" profile, see application-oidc.yaml
  keycloak:
    devservices:
      enabled: false
  micrometer:
    binder:
      netty:
        enabled: false
      http-client:
        enabled: false

"%test":
  quarkus:
    quinoa:
      enabled: false

module:
  kubernetes-api:
    enabled: true
  llm-prometheus:
    enabled: true
  llm-anthropic:
    enabled: true
  extension:
    path: "extensions"

evaluation:
  cache:
    enabled: true
    maximum-size: 5000
    expire-after-write: 10m

compaction:
  cron: "0 1 * * * ?" # a minute past every hour
  window: 1h
  delay: 1m

monitor:
  heartbeat: "10s"
  environments-file: "monitored/monitored-environments.yaml"

ui:
  max-date-range:
    duration: 1
    unit: YEARS

connector:
  boavizta:
    uri: "https://api.boavizta.org/v1/"
    #proxy-url: "http://proxy.example.com:3128"
  ecologits:
    uri: "https://api.ecologits.ai/"
    #proxy-url: "http://proxy.example.com:3128"

wombat:
  # standalone: samples its environments into its own database (single-instance setup)
  # aggregator: stores and serves the metrics pushed by workers on POST /api/metrics, samples nothing itself
  # worker:     samples its environments and pushes the metrics to an aggregator, see doc/distributed.md
  mode: standalone

  ## Worker mode Configuration
  #worker:
  #  id: "east"  # owner of the environments this worker declares to the aggregator, unique among its workers
  #  aggregator:
  #    url: "https://wombat-aggregator.example.com"
  #    api-key: "<key holding api.metric.write and api.environment.write on the aggregator>"
  #    proxy-url: "http://proxy.example.com:3128"  # optional, HTTP proxy to reach the aggregator through
  #    timeout: 30s

  ## Secret Resolution Configuration
  # Write mode defaults to DISABLED; DATABASE is selected at startup and requires a restart to change.
  # Supply KEKs through external configuration (e.g. environment-variable
  # interpolation); each value must be Base64 for a 32-byte AES key. Never commit actual KEK material.
  #secret:
  #  write-mode: database
  #  directory:
  #    path: "/secrets"
  #  keystore:
  #    path: "/secrets/keystore.p12"
  #    password: "secretpassword"
  #    type: "PKCS12"
  #  database:
  #    active-kek-id: "current"
  #    kek:
  #      current: "${WOMBAT_SECRET_DATABASE_KEK_CURRENT}"

backup:
  enabled: false
  cron: "0 0 2 * * ?"
  restore-on-startup: true
  cleanup:
    enabled: true
    cron: "0 0 3 * * ?"
    retain-last: 10
  ## S3 Backup Storage Configuration
  #s3:
  #  endpoint: "https://s3.amazonaws.com"
  #  bucket: "wombat-backups"
  #  region: "us-east-1"
  #  key-prefix: "backups/"
  #  access-key: "your-access-key"
  #  secret-key: "your-secret-key"
