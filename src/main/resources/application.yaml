quarkus:
  banner:
    path: wombat-banner.txt
  http:
    limits:
      max-initial-line-length: 32768
    auth:
      permission:
        ui-pages:
          policy: wombat-ui-page
          paths:
            - /
            - /impact
            - /impact/*
            - /users
            - /users/*
            - /api-keys
            - /api-keys/*
            - /environments
            - /environments/*
  quinoa:
    ui-dir: src/main/webui
    build-dir: dist
    enable-spa-routing: true
    run-tests: true
    ignored-path-prefixes:
      - /api/
      - /q/
      - /logout
      - /auth/
    package-manager-install:
      ~: true
      node-version: 22.22.2
    dev-server:
      port: 5173
  jackson:
    # Asset properties are served as they are declared, e.g. `duration: PT2H`, matching their JSON schema
    write-durations-as-timestamps: false
  rest-client:
    logging:
      scope: none
      body-limit: 1024
  log:
    category:
      "persistence":
        min-level: TRACE
        level: TRACE
      "io.quarkus.kubernetes.client.deployment.DevServicesKubernetesProcessor":
        level: "OFF"
      "io.quarkus.datasource.deployment.devservices.DevServicesDatasourceProcessor":
        level: "OFF"
  smallrye-openapi:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger
    always-include: true
  # Named datasources for runtime backend switching. They are explicitly declared so Quarkus compiles the correct JDBC drivers and dialects.
  # At runtime, PersistenceBackendConfigSourceFactory picks the backend based on persistence.backend.mode ; only the active backend is then instantiated.
  datasource:
    sqlite:
      active: false
      db-kind: sqlite
    postgresql:
      active: false
      db-kind: postgresql
  flyway:
    sqlite:
      locations: classpath:db/migration/sqlite
    postgresql:
      locations: classpath:db/migration/postgresql
  scheduler:
    enabled: true
  kubernetes-client:
    devservices:
      enabled: false
  vault:
    devservices:
      enabled: false
#    url: "${VAULT_ADDR}"
#    kv-secret-engine-mount-path: secret
#    tls:
#      ca-cert: "/etc/vault/ca.pem"
#      skip-verify: false
  oidc:
    tenant-enabled: false # enabled by the "oidc" profile, see application-oidc.yaml
  keycloak:
    devservices:
      enabled: false
  micrometer:
    binder:
      netty:
        enabled: false
      http-client:
        enabled: false

"%test":
  quarkus:
    quinoa:
      enabled: false

wombat:
  # standalone: samples its environments into its own database (single-instance setup)
  # aggregator: stores and serves the metrics pushed by workers on POST /api/workers/{worker}/metrics, samples nothing itself
  # worker:     samples its environments and pushes the metrics to an aggregator, see doc/distributed.md
  mode: standalone

  ## Worker mode Configuration
  #worker:
  #  id: "east"  # owner of the environments this worker declares to the aggregator, unique among its workers
  #  aggregator:
  #    url: "https://wombat-aggregator.example.com"
  #    api-key: "<key holding api.metric.write and api.environment.write on the aggregator>"
  #    proxy-url: "http://proxy.example.com:3128"  # optional, HTTP proxy to reach the aggregator through
  #    timeout: 30s
  #  environments:
  #    # true: PUT /api/worker/environments also declares environments (e.g. from a sidecar), on top of the monitored-environments file
  #    api: false

  monitor:
    heartbeat: "10s"
    # Optional: the environments provisioned at startup, none when there is no file. See doc/provisioning.md
    environments-file: "monitored/monitored-environments.yaml"

  evaluator:
    cache:
      enabled: true
      maximum-size: 5000
      expire-after-write: 10m

  module:
    # Modules are enabled or disabled from Settings > Modules
    extension:
      path: "extensions"
      # Whether the modules of an extension jar seen for the first time go live at that startup, or wait for a redeploy;
      # the modules Wombat ships always go live
      auto-deploy: true
    deployment:
      # How often an instance deploys the latest core redeploy, and writes its heartbeat; an instance missing 3 is gone
      poll-interval: 30s
      # Identifies this instance among the replicas: the pod name in Kubernetes, "wombat" when HOSTNAME is unset
      instance-id: ${HOSTNAME:wombat}
    # The settings of each module, by its full name; see doc/modules.md. Those below are the modules' own defaults
    settings:
      tech.illuin.wombat-module.boavizta:
        uri: "https://api.boavizta.org/v1/"
        #proxy-url: "http://proxy.example.com:3128"
      tech.illuin.wombat-module.ecologits:
        uri: "https://api.ecologits.ai/"
        #proxy-url: "http://proxy.example.com:3128"

  ## Secret Resolution Configuration
  # Write mode defaults to "disabled".
  # Supply KEKs through external configuration (e.g. environment-variable interpolation); each value must be Base64 for a 32-byte AES key.
  # Never commit actual KEK material.
  #secret:
  #  write-mode: database
  #  directory:
  #    path: "/secrets"
  #  keystore:
  #    path: "/secrets/keystore.p12"
  #    password: "secretpassword"
  #    type: "PKCS12"
  #  database:
  #    active-kek-id: "current"
  #    kek:
  #      current: "${WOMBAT_SECRET_DATABASE_KEK_CURRENT}"
  #  vault:
  #    enabled: true # Vault resolver, read-only; `write-mode: vault` makes it read-write
  #    path-prefix: wombat
  #  cache:
  #    ttl: 10m # how long a resolved secret is kept in memory, 0 disables the cache

persistence:
  backend:
    mode: sqlite
    sqlite:
      jdbc-url: "jdbc:sqlite:./data/db/local.db"
      backup:
        enabled: false
        cron: "0 0 2 * * ?"
        restore-on-startup: true
        cleanup:
          enabled: true
          cron: "0 0 3 * * ?"
          retain-last: 10
        ## S3 Backup Storage Configuration
        #s3:
        #  endpoint: "https://s3.amazonaws.com"
        #  bucket: "wombat-backups"
        #  region: "us-east-1"
        #  key-prefix: "backups/"
        #  access-key: "your-access-key"
        #  secret-key: "your-secret-key"
    ## PostgreSQL Configuration
    #postgresql:
    #  jdbc-url: "jdbc:postgresql://localhost:5432/wombat"
    #  username: my-username
    #  password: my-password

  compaction:
    cron: "0 1 * * * ?" # a minute past every hour
    window: 1h
    delay: 1m

ui:
  max-date-range:
    duration: 1
    unit: YEARS
