quarkus:
  oidc:
    tenant-enabled: true
    application-type: hybrid
    authentication:
      scopes:
        - email
        - profile
      redirect-path: /auth/callback
      restore-path-after-redirect: true
  http:
    proxy:
      proxy-address-forwarding: true
      enable-forwarded-host: true
    auth:
      permission:
        public:
          policy: permit
          paths:
            - /q/metrics
            - /q/health
            - /q/health/*
            - /logout
            - /logout/*
            - /public/*
        authenticated:
          policy: wombat-access # authenticated + optional auth.* rules
          paths:
            - /*

