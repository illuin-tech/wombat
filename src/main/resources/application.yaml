quarkus:
  banner:
    path: wombat-banner.txt
  http:
    limits:
      max-initial-line-length: 32768
  rest-client:
    logging:
      scope: none
      body-limit: 1024
  log:
    category:
      "persistence":
        min-level: TRACE
        level: TRACE
      "io.quarkus.kubernetes.client.deployment.DevServicesKubernetesProcessor":
        level: "OFF"
      "io.quarkus.datasource.deployment.devservices.DevServicesDatasourceProcessor":
        level: "OFF"

  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:./data/db/local.db"
      min-size: 0
  ## PostgreSQL Datasource Configuration
  #datasource:
  #  db-kind: postgresql
  #  username: my-username
  #  password: my-password
  #  jdbc:
  #    url: "jdbc:postgresql://localhost:5432/wombat"

  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: false
    locations: classpath:db/migration/${quarkus.datasource.db-kind}
  scheduler:
    enabled: true
  kubernetes-client:
    devservices:
      enabled: false
  oidc:
    tenant-enabled: false # enabled by the "oidc" profile, see application-oidc.yaml
  keycloak:
    devservices:
      enabled: false
  micrometer:
    binder:
      netty:
        enabled: false
      http-client:
        enabled: false

module:
  kubernetes-api:
    enabled: true
  llm-prometheus:
    enabled: true
  llm-static:
    enabled: true
  extension:
    path: "extensions"

compaction:
  cron: "0 1 * * * ?" # a minute past every hour
  window: 1h
  delay: 1m

monitor:
  heartbeat: "*/10 * * * * ?" # every 10s
  environments-file: "monitored/monitored-environments.yaml"

ui:
  max-date-range:
    duration: 1
    unit: YEARS

connector:
  boavizta:
    uri: "https://api.boavizta.org/v1/"
  ecologits:
    uri: "https://api.ecologits.ai/"

backup:
  enabled: false
  cron: "0 0 2 * * ?"
  restore-on-startup: true
  cleanup:
    enabled: true
    cron: "0 0 3 * * ?"
    retain-last: 10
  ## S3 Backup Storage Configuration
  #s3:
  #  endpoint: "https://s3.amazonaws.com"
  #  bucket: "wombat-backups"
  #  region: "us-east-1"
