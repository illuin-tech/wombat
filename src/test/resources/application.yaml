quarkus:
  rest-client:
    boavizta-api-url:
      uri: "http://localhost:0/boavizta"
    ecologits-api-url:
      uri: "http://localhost:0/ecologits"
  # Database configuration is handled dynamically by PersistenceBackendConfigSourceFactory
  # based on persistence.backend.mode. The values below are build-time defaults only
  # and are overridden at runtime with priority Integer.MAX_VALUE - 1000.
  datasource:
    db-kind: sqlite
  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    locations: classpath:db/migration/sqlite
  scheduler:
    enabled: false
  devservices:
    enabled: false
  kubernetes-client:
    devservices:
      enabled: false
  log:
    category:
      "org.testcontainers.dockerclient":
        level: "OFF"
      "tech.illuin.wombat.persistence.backup":
        level: "OFF"
  jacoco:
    data-file: target/jacoco.exec
    reuse-data-file: true
    report: false

persistence:
  backend:
    mode: sqlite
    sqlite:
      jdbc-url: "jdbc:sqlite:target/wombat-test.db"
      backup:
        enabled: false
        s3:
          endpoint: "http://localhost:0"
          bucket: "wombat-test"
          region: "us-east-1"
          key-prefix: "tests/"
          access-key: "test"
          secret-key: "test"

  compaction:
    cron: "0 1 * * * ?"
    window: 1h
    delay: 1m

ui:
  max-date-range:
    duration: 1
    unit: YEARS

wombat:
  monitor:
    heartbeat: "1s"
    environments-file: monitored-environments-test.yaml

  evaluator:
    cache:
      enabled: true
      maximum-size: 5000
      expire-after-write: 10m

  module:
    kubernetes-api:
      enabled: true
    llm-prometheus:
      enabled: true
    llm-anthropic:
      enabled: true
    extension:
      path: "/target/extensions"
