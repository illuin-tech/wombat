quarkus:
  rest-client:
    boavizta-api-url:
      uri: "http://localhost:0/boavizta"
    ecologits-api-url:
      uri: "http://localhost:0/ecologits"
  scheduler:
    enabled: false
  devservices:
    enabled: false
  kubernetes-client:
    devservices:
      enabled: false
  log:
    category:
      "org.testcontainers.dockerclient":
        level: "OFF"
      "tech.illuin.wombat.persistence.backup":
        level: "OFF"
  jacoco:
    data-file: target/jacoco.exec
    reuse-data-file: true
    report: false

persistence:
  backend:
    mode: sqlite
    sqlite:
      jdbc-url: "jdbc:sqlite::memory:"
      backup:
        enabled: false
        s3:
          endpoint: "http://localhost:0"
          bucket: "wombat-test"
          region: "us-east-1"
          key-prefix: "tests/"
          access-key: "test"
          secret-key: "test"

  compaction:
    cron: "0 1 * * * ?"
    window: 1h
    delay: 1m

ui:
  max-date-range:
    duration: 1
    unit: YEARS

wombat:
  monitor:
    heartbeat: "1s"
    environments-file: monitored-environments-test.yaml

  # Holds the kubeconfig of the cluster in monitored-environments-test.yaml
  secret:
    directory:
      path: src/test/resources/secrets

  evaluator:
    cache:
      enabled: true
      maximum-size: 5000
      expire-after-write: 10m

  # Unreachable, and distinct from the public APIs the modules fall back to: see ConnectorSettingsTest
  connector:
    boavizta:
      uri: "http://localhost:0/boavizta/v1/"
      proxy-url: "http://proxy.example.com:3128"
    ecologits:
      uri: "http://localhost:0/ecologits/"

  module:
    extension:
      path: "/target/extensions"
